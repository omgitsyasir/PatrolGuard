services:
  patrolguard:
    image: ghcr.io/omgitsyasir/patrolguard:latest
    container_name: patrolguard
    ports:
      - "3000:3000"
    volumes:
      # Persistent storage: SQLite DB, incident photos, and voice memos.
      - patrolguard-data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    restart: unless-stopped

volumes:
  patrolguard-data: